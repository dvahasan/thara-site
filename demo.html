<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thara · Try the app</title>
<meta name="description" content="A working copy of Thara in your browser: Today, Records, Plan and More, the add menu, and every figure made up. Nothing to install and no account.">
<meta name="theme-color" content="#242037">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script>
/* Before the first paint: the viewer's theme, language and effects, kept in
   the same keys the rest of the site uses. Storage can be missing or
   blocked; the page then simply follows the device. */
(function () {
  var d = document.documentElement;
  function g(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  var t = g('thara-theme');
  if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t);
  if (g('thara-motion') === 'off') d.setAttribute('data-motion', 'off');
  if (g('thara-lang') === 'ar') { d.lang = 'ar'; d.dir = 'rtl'; }
})();
</script>
<style>
/* Thara demo. The app's own Daybook palette (lib/core/theme/daybook_colors.dart):
   ink and lime for emphasis, warm paper for the ground, violet, peach and
   pale lime for neutral, outgoing and incoming rows. The title bar and the
   bottom bar are ink by day and by night. */
:root {
  --ink: #242037; --lime: #dff375; --lime-edge: #b3c64c;
  --nav-selected: #45395a; --nav-ink: #e4daee;
  --on-ink: #fff; --on-ink-muted: #dfd3f6; --on-pale-lime: #3b491a; --lime-deep: #7d8f1f;
  --paper: #f8f6ef; --surface: #fffefa; --text: #262137; --muted: #655f72; --line: #ded9e3;
  --violet: #ebe4fa; --peach: #f9e0d4; --pale-lime: #eef5c4; --purple: #513381;
  --error: #a33b3c; --field-line: #8b8595; --bar-fill: #7350a6;
  --bar-income: #7d8f1f; --bar-spending: #8a64b8; --income-text: #366326;
  --chosen-bg: var(--ink); --chosen-fg: #fff; --focus: var(--purple);
  --scrim: rgba(36, 32, 55, .42);
  --shadow: 0 1px 2px rgba(36, 32, 55, .06), 0 22px 46px -26px rgba(36, 32, 55, .45);
  --ease: cubic-bezier(.22, 1, .36, 1);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Arabic", Tahoma, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #211b30; --surface: #2d253d; --text: #f8efff; --muted: #c5b8d4; --line: #51455f;
    --violet: #443457; --peach: #543843; --pale-lime: #dce89e; --purple: #e1c5ff;
    --error: #ffb2b6; --field-line: #8f82a1; --bar-fill: #b294ea; --bar-income: #b7c952;
    --income-text: #cfe27a; --chosen-bg: var(--lime); --chosen-fg: var(--ink);
    --scrim: rgba(8, 5, 16, .58);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 22px 46px -26px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #211b30; --surface: #2d253d; --text: #f8efff; --muted: #c5b8d4; --line: #51455f;
  --violet: #443457; --peach: #543843; --pale-lime: #dce89e; --purple: #e1c5ff;
  --error: #ffb2b6; --field-line: #8f82a1; --bar-fill: #b294ea; --bar-income: #b7c952;
  --income-text: #cfe27a; --chosen-bg: var(--lime); --chosen-fg: var(--ink);
  --scrim: rgba(8, 5, 16, .58);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 22px 46px -26px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--text);
  font: 400 16px/1.4 var(--font); -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
:lang(ar) * { letter-spacing: 0 !important; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.tbar :focus-visible, .nav :focus-visible, .arc :focus-visible, .hero :focus-visible, .back:focus-visible {
  outline-color: var(--lime); box-shadow: 0 0 0 4px var(--ink);
}
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
[dir="rtl"] .ic.dir { transform: scaleX(-1); }

/* ---------- the stage: a phone-sized app on a desktop, the whole screen on a phone ---------- */
.stage {
  min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; padding: 16px; position: relative; overflow: hidden;
}
.bg-rings { position: fixed; inset: 0; pointer-events: none; z-index: 0; color: var(--line); }
.bg-rings svg { position: absolute; width: 1000px; height: 1000px; top: -360px; inset-inline-end: -320px; }
.bg-rings svg + svg { width: 700px; height: 700px; top: auto; bottom: -380px; inset-inline-start: -260px; inset-inline-end: auto; }
.bg-rings circle { fill: none; stroke: currentColor; }
.stage-bar {
  position: relative; z-index: 1; width: 400px; max-width: 100%;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.back {
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px 0 12px;
  border-radius: 999px; background: var(--ink); color: var(--on-ink); text-decoration: none;
  font-weight: 900; font-size: 17px; letter-spacing: -.03em; flex: none;
}
.back .ic { width: 18px; height: 18px; }
.cap { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.35; max-width: 250px; text-align: end; }
.device {
  position: relative; z-index: 1; width: 400px; max-width: 100%;
  height: min(860px, calc(100dvh - 92px)); min-height: 560px;
  border: 10px solid var(--ink); border-radius: 34px; background: var(--ink);
  box-shadow: 0 34px 80px -34px rgba(36, 32, 55, .6); overflow: hidden;
}
@media (max-width: 520px) {
  .stage { display: block; padding: 0; min-height: 0; }
  .stage-bar, .bg-rings { display: none; }
  .device { width: 100%; height: 100dvh; min-height: 0; border: 0; border-radius: 0; box-shadow: none; }
}
@media (min-width: 521px) { .phone-only { display: none !important; } }

/* ---------- the app shell ---------- */
.app {
  position: relative; height: 100%; display: flex; flex-direction: column;
  overflow: hidden; background: var(--paper); isolation: isolate; border-radius: 24px;
}
@media (max-width: 520px) { .app { border-radius: 0; } }

.tbar {
  flex: none; position: relative; z-index: 6; background: var(--ink); color: var(--on-ink);
  display: flex; align-items: center; gap: 8px;
  padding: env(safe-area-inset-top) 8px 0 8px; height: calc(58px + env(safe-area-inset-top));
  border-bottom: 1px solid rgba(228, 218, 238, .2);
}
.brand {
  display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 0 6px;
  background: none; border: 0; color: inherit; cursor: pointer; border-radius: 12px;
}
.brand .glyph { width: 27px; height: 27px; transition: transform .62s var(--ease); }
.wordmark { font-size: 24px; font-weight: 900; letter-spacing: -.07em; line-height: 1; }
.tbar .acts { margin-inline-start: auto; display: flex; gap: 7px; }
.circ {
  width: 44px; height: 44px; border-radius: 50%; padding: 0; display: grid; place-items: center;
  border: 1.5px solid rgba(228, 218, 238, .45); background: transparent; color: var(--on-ink); cursor: pointer;
  transition: transform .15s var(--ease), background .15s;
}
.circ .ic { width: 21px; height: 21px; }
.circ[aria-expanded="true"], .circ[aria-pressed="true"] { background: rgba(228, 218, 238, .14); }
.circ.lime { background: var(--lime); border-color: var(--lime-edge); color: var(--ink); font-weight: 900; font-size: 19px; }
.circ.lime[aria-expanded="true"] { box-shadow: 0 0 0 3px rgba(223, 243, 117, .35); }

.sbar {
  flex: none; height: 0; overflow: hidden; visibility: hidden; background: var(--paper);
  transition: height .26s var(--ease), visibility .26s;
}
.sbar.open { height: 66px; visibility: visible; }
.sfield {
  margin: 10px 12px 0; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 6px 0 14px;
  border: 1.5px solid var(--field-line); border-radius: 14px; background: var(--surface);
}
.sfield:focus-within { border-color: var(--purple); }
.sfield input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 16px; min-height: 44px; }
.sfield input::-webkit-search-cancel-button { display: none; }
.sfield .ic { color: var(--muted); }
.mini {
  width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; border: 0; flex: none;
  background: transparent; color: var(--muted); cursor: pointer; padding: 0;
}

.pager { flex: 1; min-height: 0; position: relative; overflow: hidden; touch-action: pan-y pinch-zoom; }
.pager.dragging { user-select: none; -webkit-user-select: none; }
.track { display: flex; height: 100%; width: 400%; will-change: transform; }
.page {
  position: relative; width: 25%; height: 100%; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain;
  padding: 16px 12px calc(110px + env(safe-area-inset-bottom)); scrollbar-width: thin; touch-action: pan-y pinch-zoom;
}
@keyframes pagein { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
.page.enter { animation: pagein .26s var(--ease) both; }
.page.enter .st { animation: rise .44s var(--ease) both; animation-delay: calc(var(--st, 0) * 42ms); }

/* ---------- type ---------- */
.kicker { margin: 2px 0 6px; font: 700 11.5px/1.3 var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
:lang(ar) .kicker { font-family: var(--font); font-size: 13px; }
.title { margin: 0; font-size: clamp(30px, 10vw, 43px); font-weight: 900; letter-spacing: -.037em; line-height: 1.06; }
:lang(ar) .title { line-height: 1.3; }
.sub { margin: 7px 0 18px; color: var(--muted); font-size: 15px; }
.sec { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 24px 0 10px; }
.sec h2 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
.link {
  background: none; border: 0; padding: 0 2px; min-height: 44px; cursor: pointer;
  color: var(--purple); font-weight: 800; font-size: 15.5px;
}
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.m { unicode-bidi: isolate; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------- cards and rows ---------- */
.card, .list { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.list { overflow: hidden; }
.row {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 62px; padding: 10px 12px;
  background: transparent; border: 0; border-top: 1px solid var(--line); text-align: start; cursor: pointer;
  color: var(--text); text-decoration: none; transition: background .15s;
}
.row:first-child { border-top: 0; }
div.row { cursor: default; }
button.row:hover, a.row:hover { background: color-mix(in srgb, var(--violet) 40%, transparent); }
.tile {
  width: 38px; height: 38px; border-radius: 10px; flex: none; display: grid; place-items: center;
  background: var(--violet); color: var(--text);
}
.t-peach { background: var(--peach); color: var(--text); }
.t-lime { background: var(--pale-lime); color: var(--on-pale-lime); }
.t-violet { background: var(--violet); color: var(--text); }
.row .tx { flex: 1; min-width: 0; }
.row b { display: block; font-weight: 700; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row small { display: block; color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.amt { font-weight: 700; font-size: 16px; }
.in { color: var(--income-text); }
.chev { color: var(--muted); }
.row small.amt-s { color: var(--text); font-weight: 700; font-size: 15px; margin-top: 2px; }
.row small.amt-s.in { color: var(--income-text); }

/* ---------- the net worth hero ---------- */
.hero {
  position: relative; overflow: hidden; background: var(--ink); color: var(--on-ink);
  border-radius: 22px; padding: 20px 18px 18px; border: 1px solid rgba(228, 218, 238, .08);
  touch-action: pan-y;
}
.rings { position: absolute; width: 330px; height: 330px; top: -96px; inset-inline-end: -128px; pointer-events: none; overflow: visible; }
.rings circle { fill: none; stroke: #e4daee; transform-box: fill-box; transform-origin: center; }
.rings .r1 { stroke-width: 28; stroke-opacity: .07; }
.rings .r2 { stroke-width: 15; stroke-opacity: .09; }
.rings .r3 { stroke-width: 1.5; stroke-opacity: .32; }
@keyframes ring { 0% { transform: scale(.9); } 45% { transform: scale(1.07); stroke-opacity: .42; } 100% { transform: scale(1); } }
.rings.wave circle { animation: ring .95s var(--ease) both; animation-delay: calc(var(--i) * 95ms); }
.hk { position: relative; margin: 0; font: 700 12px/1.3 var(--mono); letter-spacing: .1em; color: var(--on-ink-muted); }
:lang(ar) .hk { font-family: var(--font); font-size: 13px; }
.big { position: relative; margin: 8px 0 14px; font-size: 44px; font-weight: 900; letter-spacing: -.05em; line-height: 1.05; }
.hrow { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.tag {
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px; border-radius: 9px;
  background: var(--pale-lime); color: var(--on-pale-lime); font: 700 12.5px/1.2 var(--mono);
}
.hero .tag { background: #eef5c4; color: #3b491a; }
:lang(ar) .tag { font-family: var(--font); font-size: 13.5px; }
.tag .ic { width: 15px; height: 15px; stroke-width: 2.2; }
.pill {
  position: relative; display: inline-flex; align-items: center; gap: 9px; min-height: 46px; padding: 0 18px;
  border-radius: 999px; border: 1.5px solid rgba(228, 218, 238, .5); background: transparent; color: var(--on-ink);
  font-weight: 800; font-size: 15.5px; cursor: pointer; transition: transform .15s var(--ease), background .15s;
}
.pill:hover { background: rgba(228, 218, 238, .08); }
.spark { position: relative; display: block; width: 100%; height: auto; margin: 14px 0 12px; overflow: visible; }
.spark .base { stroke: rgba(228, 218, 238, .16); stroke-width: 1; }
.spark .line { fill: none; stroke: var(--lime); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.spark .dot { fill: var(--lime); }
@keyframes draw { from { stroke-dasharray: 1; stroke-dashoffset: 1; } to { stroke-dasharray: 1; stroke-dashoffset: 0; } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.page.enter .spark .line { animation: draw 1s var(--ease) .12s both; }
.page.enter .spark .area, .page.enter .spark .dot { animation: fadein .5s ease .7s both; }

/* ---------- buttons, chips, tiles ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 48px; padding: 0 18px;
  border-radius: 14px; border: 1.5px solid var(--field-line); background: var(--surface); color: var(--text);
  font-weight: 800; font-size: 16px; cursor: pointer; text-decoration: none; text-align: center;
  transition: transform .15s var(--ease), filter .15s;
}
.btn.lime { background: var(--lime); border-color: var(--lime-edge); color: var(--ink); }
.btn.danger { background: var(--peach); border-color: transparent; color: var(--error); }
.btn.wide { width: 100%; }
.btn.sm { min-height: 44px; padding: 0 14px; font-size: 14.5px; border-radius: 12px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:hover:not(:disabled) { filter: brightness(.98); }
.btn:active:not(:disabled), .row:active, .chip:active, .circ:active, .pill:active, .daily:active, .nr:active, .at:active, .navb:active, .brand:active { transform: scale(.97); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; min-height: 44px; padding: 0 18px; border-radius: 999px;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--text); font-weight: 800; font-size: 15px;
  cursor: pointer; transition: background .2s, color .2s, border-color .2s, transform .15s var(--ease);
}
.chip[aria-pressed="true"] { background: var(--chosen-bg); border-color: var(--chosen-bg); color: var(--chosen-fg); }
.chip .ic { width: 18px; height: 18px; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.daily {
  display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; min-height: 70px; padding: 13px 14px;
  border-radius: 16px; border: 1px solid var(--line); background: var(--surface); color: var(--text); text-align: start;
  cursor: pointer; min-width: 0;
}
div.daily { cursor: default; }
.daily.v { background: var(--violet); }
.daily small { display: block; color: var(--muted); font-size: 14px; }
.daily b { display: block; font-size: clamp(16px, 4.9vw, 19px); font-weight: 800; margin-top: 2px; }
@media (max-width: 359px) { .daily > .ic { display: none; } }
.daily > span { min-width: 0; }
.daily small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.goal { padding: 14px; }
.goal + .goal { margin-top: 10px; }
.gtop { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.gtop .tx { flex: 1; min-width: 0; }
.gtop b { display: block; font-size: 17px; font-weight: 800; }
.gtop small { display: block; color: var(--muted); font-size: 14px; }
.gtop .pc { font-size: 19px; font-weight: 900; }
.prog { position: relative; height: 10px; border-radius: 99px; background: var(--violet); overflow: hidden; }
.prog i { display: block; height: 100%; border-radius: inherit; background: var(--bar-fill); transition: width .7s var(--ease); }
.prog em { position: absolute; top: 0; bottom: 0; width: 2px; margin-inline-start: -1px; background: var(--text); opacity: .45; }
.goal p { margin: 8px 0 12px; }
.empty { padding: 18px; }
.empty h3 { margin: 0 0 6px; font-size: 21px; font-weight: 800; }
.empty p { margin: 0 0 16px; color: var(--muted); font-size: 15.5px; line-height: 1.5; }
.count { margin: 2px 0 8px; color: var(--muted); font-weight: 800; font-size: 15px; }
.month { margin: 24px 0 10px; font-size: 20px; font-weight: 800; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.glist.fade { animation: rise .3s var(--ease) both; }
@keyframes flash { 0%, 55% { box-shadow: 0 0 0 3px var(--lime-deep); } 100% { box-shadow: 0 0 0 0 transparent; } }
.flash { animation: flash 1.5s var(--ease); }
.split { padding: 12px 14px; border-top: 1px solid var(--line); }
.split:first-child { border-top: 0; }
.sl { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.sl b { font-weight: 800; }
.split small { display: block; margin-top: 6px; }
.due .btn { flex: none; }

/* ---------- fields ---------- */
.field { display: block; margin: 0 0 14px; min-width: 0; }
.field > span:first-child { display: block; margin: 0 0 6px; font-weight: 800; font-size: 14.5px; }
.input, .select {
  width: 100%; min-height: 50px; padding: 0 14px; border-radius: 12px; border: 1.5px solid var(--field-line);
  background: var(--surface); color: var(--text); font-size: 16.5px; outline: none;
}
.input:focus, .select:focus { border-color: var(--purple); box-shadow: 0 0 0 1px var(--purple); }
.selwrap { position: relative; display: block; }
.select { appearance: none; -webkit-appearance: none; padding-inline-end: 40px; text-overflow: ellipsis; }
.selwrap .ic { position: absolute; top: 50%; inset-inline-end: 13px; transform: translateY(-50%); pointer-events: none; color: var(--text); width: 18px; height: 18px; }
.amtf {
  display: flex; align-items: center; gap: 8px; min-height: 66px; padding: 0 16px; border-radius: 14px;
  border: 1.5px solid var(--field-line); background: var(--surface);
}
.amtf:focus-within { border-color: var(--purple); box-shadow: 0 0 0 1px var(--purple); }
.amtf .cur { font-weight: 800; font-size: 20px; color: var(--muted); }
.amtf input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
[dir="rtl"] .amtf input { text-align: right; }
.seg {
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; margin: 0 0 16px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
}
.seg button {
  min-height: 44px; padding: 0 8px; border-radius: 999px; border: 0; background: transparent; color: var(--text);
  font-weight: 800; font-size: 15px; cursor: pointer; transition: background .2s, color .2s;
}
.seg button[aria-pressed="true"] { background: var(--chosen-bg); color: var(--chosen-fg); }
.err { min-height: 0; margin: 0 0 12px; color: var(--error); font-weight: 700; font-size: 14.5px; }
.err:empty { display: none; }
.btns { display: flex; gap: 10px; }
.btns .btn { flex: 1; }

/* ---------- bottom bar ---------- */
.nav {
  position: absolute; z-index: 7; inset-inline: 0; bottom: 0; background: var(--ink);
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px;
  padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
}
.navb {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  height: 54px; border-radius: 14px; border: 0; background: transparent; color: var(--nav-ink);
  font-weight: 800; font-size: 12px; cursor: pointer; transition: background .2s, transform .15s var(--ease);
}
.navb .ic { width: 23px; height: 23px; }
.navb[aria-current="page"] { background: var(--nav-selected); }
.navb.add { justify-content: flex-end; padding-bottom: 6px; }
.plus {
  position: absolute; top: -36px; left: 50%; width: 62px; height: 62px; margin-left: -31px;
  border-radius: 50%; background: var(--lime); border: 4px solid var(--ink); color: var(--ink);
  display: grid; place-items: center; transition: transform .3s var(--ease);
}
.plus .ic { width: 28px; height: 28px; stroke-width: 2; }
.navb.add[aria-expanded="true"] .plus .ic { transform: rotate(45deg); }

/* ---------- the arc menu ---------- */
.arc { position: absolute; inset: 0; z-index: 20; }
.arc-scrim {
  position: absolute; inset: 0; width: 100%; border: 0; padding: 0; cursor: default;
  background: rgba(36, 32, 55, .3); -webkit-backdrop-filter: blur(7px); backdrop-filter: blur(7px);
  opacity: 0; transition: opacity .26s ease;
}
.arc.open .arc-scrim { opacity: 1; }
.dome, .dome-edge {
  position: absolute; inset: 0; pointer-events: none;
  clip-path: circle(28px at var(--bx) var(--by)); transition: clip-path .36s var(--ease);
}
.dome-edge { background: rgba(228, 218, 238, .3); }
.dome { background: var(--ink); }
.arc.open .dome { clip-path: circle(var(--R) at var(--cx) var(--cy)); }
.arc.open .dome-edge { clip-path: circle(calc(var(--R) + 1.5px) at var(--cx) var(--cy)); }
.arc-item {
  position: absolute; left: var(--bx); top: var(--by); width: 90px; margin: -24px 0 0 -45px;
  display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0; border: 0; background: none;
  color: var(--on-ink); font-weight: 800; font-size: 13px; line-height: 1.15; text-align: center; cursor: pointer;
  opacity: 0; transform: translate(0, 0) scale(.3);
  transition: transform .38s cubic-bezier(.2, .9, .3, 1.12) var(--d, 0ms), opacity .2s ease var(--d, 0ms);
}
.arc.open .arc-item { opacity: 1; transform: translate(var(--x), var(--y)) scale(1); }
.arc-item .ac {
  width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center;
  background: #3d3452; border: 1.5px solid rgba(228, 218, 238, .28); color: #fff;
}
.arc-item .ac .ic { width: 22px; height: 22px; }
.arc-item .ac.k-peach { background: #f9e0d4; border-color: #f9e0d4; color: #242037; }
.arc-item .ac.k-lime { background: #eef5c4; border-color: #eef5c4; color: #3b491a; }
.arc-item .ac.k-violet { background: #ebe4fa; border-color: #ebe4fa; color: #242037; }
.arc-item.lime .ac { background: transparent; border: 2px solid var(--lime); color: var(--lime); }
.arc-item.lime { color: var(--lime); }
.arc-item:focus-visible { outline: none; box-shadow: none; }
.arc-item:focus-visible .ac { outline: 2px solid var(--lime); outline-offset: 3px; }
.arc-x {
  position: absolute; left: var(--bx); top: var(--by); width: 62px; height: 62px; margin: -31px 0 0 -31px;
  border-radius: 50%; background: var(--lime); border: 4px solid var(--ink); color: var(--ink);
  display: grid; place-items: center; padding: 0; cursor: pointer;
}
.arc-x .ic { width: 28px; height: 28px; stroke-width: 2; transition: transform .3s var(--ease); }
.arc.open .arc-x .ic { transform: rotate(45deg); }

/* ---------- sheets, the pop-up, the dialog, the toast ---------- */
.layer { position: absolute; inset: 0; z-index: 30; display: flex; flex-direction: column; justify-content: flex-end; }
.scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity .28s ease; }
.layer.open .scrim, .dlg .scrim { opacity: 1; }
.sheet {
  position: relative; max-height: calc(100% - 24px); overflow-y: auto; overscroll-behavior: contain;
  background: var(--paper); border-radius: 22px 22px 0 0; padding: 6px 14px calc(18px + env(safe-area-inset-bottom));
  transform: translateY(100%); transition: transform .34s var(--ease); box-shadow: 0 -12px 40px rgba(0, 0, 0, .18);
  outline: none;
}
.layer.open .sheet { transform: none; }
.sheet.swap { animation: rise .3s var(--ease) both; }
.handle { width: 40px; height: 5px; border-radius: 9px; background: var(--line); margin: 6px auto 12px; }
.shead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 14px; }
.shead h2 { margin: 0; font-size: 30px; font-weight: 900; letter-spacing: -.035em; line-height: 1.1; min-width: 0; }
:lang(ar) .shead h2 { line-height: 1.35; }
.xbtn {
  flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; padding: 0;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer;
}
.hh { margin: 20px 0 10px; font-size: 20px; font-weight: 800; }
.searchf {
  display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 0 16px; margin: 0 0 4px;
  border-radius: 14px; border: 1.5px solid var(--field-line); background: var(--surface);
  transition: border-color .2s, box-shadow .2s;
}
.searchf:focus-within { border-color: var(--purple); box-shadow: 0 0 0 1px var(--purple); }
.searchf input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 17px; }
.searchf .ic { color: var(--muted); width: 22px; height: 22px; }
.newrec { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
.nr {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 96px;
  padding: 12px 4px; border-radius: 16px; border: 1px solid var(--line); font-weight: 800; font-size: 16px; cursor: pointer;
  transition: transform .15s var(--ease);
}
.nr .bub { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--text); }
.acts4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
.at {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 76px;
  padding: 10px 4px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--text);
  font-weight: 800; font-size: 13.5px; line-height: 1.15; text-align: center; cursor: pointer; transition: transform .15s var(--ease);
}
.at .sq { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--pale-lime); color: var(--on-pale-lime); }
.tip { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
.kv { margin: 0 0 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); overflow: hidden; }
.kv div { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; padding: 12px 14px; border-top: 1px solid var(--line); }
.kv div:first-child { border-top: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 700; text-align: end; min-width: 0; overflow-wrap: anywhere; }
.dbig { margin: 0 0 16px; font-size: 40px; font-weight: 900; letter-spacing: -.045em; }
.inapp { text-align: center; padding: 6px 4px 14px; }
.inapp .tile { width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 14px; }
.inapp .tile .ic { width: 30px; height: 30px; }
.inapp .lead { font-size: 18px; font-weight: 700; margin: 0 0 8px; line-height: 1.45; }
.inapp p { margin: 0; }

.receipt-wrap { position: relative; padding: 16px 10px 22px; margin: 0 0 14px; }
.receipt {
  position: relative; width: min(270px, 100%); margin: 0 auto; padding: 18px 16px 20px; background: #fffdf6; color: #2a2633;
  font: 500 12.5px/1.55 var(--mono); border-radius: 3px; transform: rotate(-1.4deg);
  box-shadow: 0 14px 30px -14px rgba(0, 0, 0, .5);
}
.receipt::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -7px; height: 8px;
  background: linear-gradient(135deg, #fffdf6 50%, transparent 50%) 0 0 / 10px 8px, linear-gradient(225deg, #fffdf6 50%, transparent 50%) 0 0 / 10px 8px;
}
.receipt h4 { margin: 0; text-align: center; font-size: 15px; letter-spacing: .12em; }
.receipt .c { text-align: center; color: #6c6677; margin: 0 0 8px; }
.receipt .ln { display: flex; justify-content: space-between; gap: 10px; }
.receipt .tot { border-top: 1.5px dashed #9a94a5; margin-top: 8px; padding-top: 6px; font-weight: 800; font-size: 14px; }
.corner { position: absolute; width: 26px; height: 26px; border: 3px solid var(--lime-deep); }
.corner.a { top: 4px; left: 4px; border-right: 0; border-bottom: 0; border-radius: 8px 0 0 0; }
.corner.b { top: 4px; right: 4px; border-left: 0; border-bottom: 0; border-radius: 0 8px 0 0; }
.corner.c { bottom: 4px; left: 4px; border-right: 0; border-top: 0; border-radius: 0 0 0 8px; }
.corner.d { bottom: 4px; right: 4px; border-left: 0; border-top: 0; border-radius: 0 0 8px 0; }
.scanline { position: absolute; left: 12%; right: 12%; top: 12%; height: 2px; background: var(--lime-deep); box-shadow: 0 0 14px var(--lime); animation: scan 2.4s ease-in-out infinite alternate; }
@keyframes scan { to { top: 86%; } }

.mic-wrap { position: relative; width: 156px; height: 156px; margin: 6px auto 10px; display: grid; place-items: center; }
.mic-wrap span { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--bar-fill); opacity: 0; animation: pulse 1.8s var(--ease) infinite; animation-delay: calc(var(--i) * .6s); }
@keyframes pulse { 0% { transform: scale(.45); opacity: .75; } 100% { transform: scale(1); opacity: 0; } }
.mic-wrap.done span { animation: none; opacity: 0; }
.mic-core { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; background: var(--lime); border: 1.5px solid var(--lime-edge); color: var(--ink); }
.mic-core .ic { width: 32px; height: 32px; }
.heard { min-height: 3.2em; margin: 0 0 6px; text-align: center; font-size: 21px; font-weight: 800; line-height: 1.35; }
.status { text-align: center; margin: 0 0 14px; }

.chat { display: flex; flex-direction: column; gap: 10px; margin: 0 0 12px; }
.msg { max-width: 88%; padding: 11px 14px; border-radius: 18px; font-size: 15.5px; line-height: 1.45; animation: rise .3s var(--ease) both; }
.msg.me { align-self: flex-end; background: var(--chosen-bg); color: var(--chosen-fg); border-end-end-radius: 6px; }
.msg.ai { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-end-start-radius: 6px; }
.msg.ai b { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--purple); margin-bottom: 3px; }
.msg.ai b .ic { width: 16px; height: 16px; }
.dots i { display: inline-block; width: 7px; height: 7px; margin: 0 2px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
.askf { display: flex; gap: 8px; align-items: center; }
.askf .input { flex: 1; }
.sendb { flex: none; width: 50px; height: 50px; border-radius: 14px; border: 1.5px solid var(--lime-edge); background: var(--lime); color: var(--ink); display: grid; place-items: center; cursor: pointer; }

.mnav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 14px; }
.mnav b { font-size: 18px; font-weight: 800; }
.bars .bl { padding: 10px 14px; border-top: 1px solid var(--line); }
.bars .bl:first-child { border-top: 0; }
.bars .bl div { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 7px; }
.wf { padding: 14px; border-top: 1px solid var(--line); }
.wf:first-child { border-top: 0; }
.wf small { display: block; color: var(--muted); font-size: 14px; }
.wf b { display: block; font-size: 26px; font-weight: 900; letter-spacing: -.03em; }

.pop {
  position: absolute; z-index: 25; top: calc(62px + env(safe-area-inset-top)); inset-inline-end: 8px;
  width: min(312px, calc(100% - 16px)); padding: 16px; border-radius: 22px;
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow);
  transform-origin: calc(100% - 22px) -8px; transform: scale(.35); opacity: 0;
  transition: transform .28s var(--ease), opacity .18s ease;
}
[dir="rtl"] .pop { transform-origin: 22px -8px; }
.pop.open { transform: none; opacity: 1; }
.pop h2 { margin: 0 0 12px; font-size: 22px; font-weight: 900; letter-spacing: -.03em; }
.pop .pl { margin: 0 0 6px; font-weight: 800; font-size: 14px; color: var(--muted); }
.pop .seg { margin-bottom: 14px; }
.trow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.trow b { display: block; font-weight: 800; }
.trow small { display: block; color: var(--muted); font-size: 13px; }
.sw::before { content: ""; position: absolute; inset: -6px; }
.sw { position: relative; flex: none; width: 52px; height: 32px; border-radius: 99px; border: 0; padding: 0; background: var(--line); cursor: pointer; transition: background .2s; }
.sw::after {
  content: ""; position: absolute; top: 4px; inset-inline-start: 4px; width: 24px; height: 24px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: inset-inline-start .22s var(--ease);
}
.sw[aria-checked="true"] { background: var(--chosen-bg); }
.sw[aria-checked="true"]::after { inset-inline-start: 24px; background: var(--chosen-fg); }

.dlg { position: absolute; inset: 0; z-index: 40; display: grid; place-items: center; padding: 20px; }
.dlg .box {
  position: relative; width: min(340px, 100%); padding: 20px; border-radius: 22px;
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); animation: pop .26s var(--ease) both;
}
@keyframes pop { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
.dlg h2 { margin: 0 0 8px; font-size: 21px; font-weight: 900; }
.dlg p { margin: 0 0 18px; color: var(--muted); line-height: 1.5; }

.toast {
  position: absolute; z-index: 50; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom));
  max-width: calc(100% - 32px); padding: 12px 18px; border-radius: 14px; background: var(--ink); color: var(--on-ink);
  border: 1px solid rgba(228, 218, 238, .2); font-weight: 700; font-size: 14.5px; text-align: center;
  transform: translate(-50%, 14px); opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .28s var(--ease);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Effects off (Appearance, or the device's own "reduce motion"): every
   widget draws its settled state at once. */
html[data-motion="off"] *, html[data-motion="off"] *::before, html[data-motion="off"] *::after {
  animation: none !important; transition: none !important;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

      case 'speakUse':
        openEditor({ type: 'expense', prefill: { amt: 24000, title: { en: WORDS.lunch[0], ar: WORDS.lunch[1] }, cat: 'eating', src: 'cash', origin: 'voice' } });
        break;
      case 'askQ': ask(t(id)); break;
      case 'anPrev': S.anMonth--; sheet(analysisHTML(), { focus: '[data-act="anPrev"]' }); break;
      case 'anNext': if (S.anMonth < 0) { S.anMonth++; sheet(analysisHTML(), { focus: S.anMonth < 0 ? '[data-act="anNext"]' : '[data-act="anPrev"]' }); } break;
    }
  });

  app.addEventListener('input', function (e) {
    var el = e.target;
    if (el.matches('input[data-money]')) {
      var v = typing(el.value);
      if (v !== el.value) { el.value = v; try { el.setSelectionRange(v.length, v.length); } catch (err) { /* not a text field */ } }
      var form = el.closest('form'); if (form) { var er = $('[data-err]', form); if (er) er.textContent = ''; }
    } else if (el === sq) {
      S.q = sq.value; renderRecords(false);
    } else if (el.matches('[data-hubq]')) {
      var b = $('[data-hubbody]', layer); if (b) b.innerHTML = hubBody(el.value);
    }
  });
  app.addEventListener('change', function (e) {
    var el = e.target;
    if (el.matches('select[data-sel]')) {
      S[el.getAttribute('data-sel')] = el.value;
      var key = el.getAttribute('data-sel');
      renderRecords(true);
      var again = $('[data-sel="' + key + '"]', pages[1]); if (again) again.focus({ preventScroll: true });
    } else if (el.closest('form[data-form="rec"]') && (el.name === 'src' || el.name === 'to')) {
      syncEditor(el.closest('form'));
    }
  });
  app.addEventListener('submit', function (e) {
    var form = e.target;
    e.preventDefault();
    switch (form.getAttribute('data-form')) {
      case 'rec': saveRecord(form); break;
      case 'goalAdd': submitGoalAdd(form); break;
      case 'goalNew': submitGoalNew(form); break;
      case 'ask': var inp = form.elements.q; ask(inp.value); inp.value = ''; break;
    }
  });

  function focusables(c) {
    return $$('a[href], button:not([disabled]), input:not([disabled]):not([type="hidden"]), select, textarea, [tabindex]:not([tabindex="-1"])', c)
      .filter(function (el) { return !el.closest('[hidden]') && !el.closest('[inert]') && el.getClientRects().length; });
  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (!dlg.hidden) { closeDlg(false); e.preventDefault(); return; }
      if (sheetOpen) { closeSheet(); e.preventDefault(); return; }
      if (popOpen) { closePop(true); e.preventDefault(); return; }
      if (arcOpen) { closeArc(); e.preventDefault(); return; }
      if (searchOpen) { closeSearch(); e.preventDefault(); return; }
      return;
    }
    var box = !dlg.hidden ? $('.box', dlg) : sheetOpen ? $('.sheet', layer) : arcOpen ? arcEl : null;
    if (arcOpen && /^Arrow(Left|Right|Up|Down)$/.test(e.key)) {
      var list = $$('.arc-item, .arc-x', arcEl), i = list.indexOf(document.activeElement);
      var step = (e.key === 'ArrowRight' || e.key === 'ArrowDown') ? 1 : -1;
      if (rtl() && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) step = -step;
      list[(i + step + list.length) % list.length].focus();
      e.preventDefault();
      return;
    }
    if (e.key === 'Tab' && box) {
      var f = focusables(box);
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && (document.activeElement === first || !box.contains(document.activeElement))) { last.focus(); e.preventDefault(); }
      else if (!e.shiftKey && (document.activeElement === last || !box.contains(document.activeElement))) { first.focus(); e.preventDefault(); }
    }
  });

  /* ---------------------------------------------------------------- start */
  seed();
  applyTheme();
  if (!S.motion) root.setAttribute('data-motion', 'off');
  applyStatic();
  var start = { '#records': 1, '#plan': 2, '#more': 3 }[location.hash] || 0;
  S.page = start;
  renderAll();
  setTrack(false);
  setInert();
  enter(start);

  // The About row reads the same manifest the app does, so a demo left open
  // for a month does not go on naming a build nobody runs any more.
  fetch('version.json', { cache: 'no-cache' })
    .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
    .then(function (v) {
      if (v && v.version) {
        S.version = { v: String(v.version), b: v.buildNumber ? String(v.buildNumber) : '' };
        renderMore();
      }
    })
    .catch(function () { /* Keep the plain About line. */ });
})();
</script>
</body>
</html>

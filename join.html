<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- An invite link (Thara build 241). The invite rides after "#", which a
     browser never sends to any server, so GitHub, which serves this page,
     only ever sees "join.html". This page loads nothing from anywhere else
     and keeps nothing: it hands the invite to Thara on this phone. -->
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Thara · Join</title>
<meta name="theme-color" content="#242037">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
/* The app's Daybook colours (daybook_colors.dart), by day and by night. */
:root {
  --ink: #242037; --lime: #dff375; --lime-edge: #b3c64c; --on-ink: #fff; --on-ink-muted: #dfd3f6;
  --paper: #f8f6ef; --surface: #fffefa; --text: #262137; --muted: #655f72; --line: #ded9e3;
  --violet: #ebe4fa; --field-line: #8b8595; --focus: #513381;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #211b30; --surface: #2d253d; --text: #f8efff; --muted: #c5b8d4; --line: #51455f;
    --violet: #443457; --field-line: #8f82a1; --focus: #dff375;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Arabic", Tahoma, sans-serif;
  font-size: 16px; line-height: 1.55; color: var(--text); background: var(--paper);
  -webkit-font-smoothing: antialiased;
}
.bar { background: var(--ink); color: var(--on-ink); padding: 0 16px; border-bottom: 1px solid rgba(228, 218, 238, .16); }
.bar div { max-width: 460px; margin: 0 auto; height: 58px; display: flex; align-items: center; gap: 7px; }
.bar svg { width: 26px; height: 26px; }
.bar b { font-size: 24px; font-weight: 900; letter-spacing: -0.07em; }
.bar b:lang(ar) { letter-spacing: 0; }
main { flex: 1; display: grid; place-items: center; padding: 24px 16px 40px; }
.card { width: min(460px, 100%); }
.hero {
  position: relative; overflow: hidden; isolation: isolate;
  background: var(--ink); color: var(--on-ink); border-radius: 22px; padding: 26px 22px 24px;
}
.hero svg.rings { position: absolute; z-index: -1; width: 420px; height: 420px; inset-inline-end: -170px; top: -150px; color: var(--on-ink); }
.rings circle { fill: none; stroke: currentColor; }
.kicker { font-family: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--on-ink-muted); }
:lang(ar) .kicker, .kicker:lang(ar) { font-family: inherit; letter-spacing: 0; }
h1 { font-size: 2.2rem; font-weight: 900; line-height: 1.05; letter-spacing: -0.04em; margin: 8px 0 10px; }
:lang(ar) h1 { letter-spacing: 0; }
.hero p { margin: 0; color: var(--on-ink-muted); }
.acts { display: grid; gap: 10px; margin-top: 16px; }
.btn {
  display: flex; align-items: center; justify-content: center; min-height: 52px; width: 100%;
  padding: 12px 16px; border-radius: 14px; font: inherit; font-weight: 800; text-align: center;
  text-decoration: none; cursor: pointer; border: 1.5px solid transparent;
  transition: transform .15s cubic-bezier(.215, .61, .355, 1);
}
.btn:active { transform: scale(.97); }
.filled { background: var(--lime); border-color: var(--lime-edge); color: var(--ink); }
.outlined { background: var(--surface); color: var(--text); border-color: var(--line); }
.note { font-size: .92rem; color: var(--muted); margin: 14px 2px 0; }
.lang { margin-top: 16px; display: flex; justify-content: center; }
.lang button {
  min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid var(--line);
  background: var(--surface); color: var(--text); font: inherit; font-weight: 800; cursor: pointer;
}
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
.hero :focus-visible { outline-color: var(--lime); }
.hidden { display: none; }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
<header class="bar">
  <div>
    <svg viewBox="0 0 96 96" aria-hidden="true"><rect x="8" y="69" width="80" height="10" rx="5" fill="currentColor"/><circle cx="20" cy="58" r="5.2" fill="currentColor"/><circle cx="46" cy="43" r="5.6" fill="currentColor"/><circle cx="72" cy="23" r="6.2" fill="currentColor"/></svg>
    <b lang="en">Thara.</b>
  </div>
</header>
<main>
  <div class="card">
    <div class="hero">
      <svg class="rings" viewBox="0 0 420 420" aria-hidden="true"><circle cx="210" cy="210" r="160" stroke-width="32" opacity=".07"/><circle cx="210" cy="210" r="110" stroke-width="20" opacity=".08"/><circle cx="210" cy="210" r="192" stroke-width="2" opacity=".18"/></svg>
      <div class="kicker" id="kicker"></div>
      <h1 id="title"></h1>
      <p id="body"></p>
      <div class="acts">
        <a id="open" class="btn filled" href="#"></a>
      </div>
    </div>
    <div class="acts">
      <a id="get" class="btn outlined" href="./#get"></a>
      <button id="copy" class="btn outlined hidden" type="button"></button>
    </div>
    <p id="note" class="note"></p>
    <div class="lang"><button id="switch" type="button"></button></div>
  </div>
</main>
<script>
(function () {
  var words = {
    ar: {
      title: 'دعوة إلى ثراء',
      body: 'افتح الدعوة في تطبيق ثراء لتنضم إلى الجمعية أو الحساب المشترك.',
      bad: 'هذا الرابط لا يحمل دعوة صالحة. اطلب من صاحب الدعوة أن يرسلها مرة أخرى.',
      open: 'افتح في ثراء',
      get: 'ليس عندي ثراء — نزّله',
      copy: 'انسخ رمز الدعوة',
      copied: 'تم النسخ. افتح ثراء ← المزيد ← حسابات العائلة ← انضم بدعوة، والصقه.',
      other: 'على آيفون أو كمبيوتر: انسخ الرمز، ثم افتح ثراء ← المزيد ← حسابات العائلة ← انضم بدعوة، والصقه.',
      android: 'إن لم يفتح ثراء، اضغط «افتح في ثراء». بعد التنزيل، ارجع إلى هذا الرابط.',
      swap: 'English',
      kicker: 'دعوة'
    },
    en: {
      title: 'An invite to Thara',
      body: 'Open the invite in the Thara app to join the gameya or the shared account.',
      bad: 'This link does not hold a valid invite. Ask the person who sent it to send it again.',
      open: 'Open in Thara',
      get: 'I don’t have Thara — download it',
      copy: 'Copy the invite code',
      copied: 'Copied. Open Thara → More → Family accounts → Join with an invite, and paste it.',
      other: 'On an iPhone or a computer: copy the code, then open Thara → More → Family accounts → Join with an invite, and paste it.',
      android: 'If Thara does not open, tap “Open in Thara”. After downloading, come back to this link.',
      swap: 'العربية',
      kicker: 'Invite'
    }
  };
  var lang = /^ar\b/i.test(navigator.language || '') ? 'ar' : 'en';
  var raw = '';
  try { raw = decodeURIComponent(location.hash.slice(1)); } catch (e) { raw = ''; }
  var valid = /^THARA-FAMILY1:[A-Za-z0-9_-]{20,4000}$/.test(raw);
  var android = /Android/i.test(navigator.userAgent || '');
  var site = location.href.split('#')[0].replace(/join\.html.*$/, '');
  // Thara catches thara://join/<code>; with no Thara on the phone, Chrome
  // goes to the download instead.
  var intent = 'intent://join/' + raw + '#Intent;scheme=thara;S.browser_fallback_url=' +
    encodeURIComponent(site + '#get') + ';end';
  var $ = function (id) { return document.getElementById(id); };

  function paint() {
    var w = words[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    $('title').textContent = w.title;
    $('kicker').textContent = w.kicker;
    $('body').textContent = valid ? w.body : w.bad;
    $('open').textContent = w.open;
    $('get').textContent = w.get;
    $('copy').textContent = w.copy;
    $('note').textContent = !valid ? '' : android ? w.android : w.other;
    $('switch').textContent = w.swap;
    $('open').classList.toggle('hidden', !valid || !android);
    $('copy').classList.toggle('hidden', !valid);
  }

  $('open').addEventListener('click', function (e) {
    e.preventDefault();
    location.href = intent;
  });
  $('copy').addEventListener('click', function () {
    var done = function () { $('note').textContent = words[lang].copied; };
    if (navigator.clipboard) {
      navigator.clipboard.writeText(raw).then(done, function () {});
    }
  });
  $('switch').addEventListener('click', function () {
    lang = lang === 'ar' ? 'en' : 'ar';
    paint();
  });
  paint();
  // Straight into Thara when the phone allows it without a tap.
  if (valid && android) {
    setTimeout(function () { location.href = intent; }, 300);
  }
})();
</script>
</body>
</html>
